name: Destroy

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git revision'
        required: false
      udap_run_id:
        description: 'UDAP run id'
        required: false

concurrency:
  group: deploy-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Empty S3 bucket before destroy
        run: |
          BUCKET=tc5-second-repo-site1-origin
          # Step 1: remove all current-version objects
          aws s3 rm s3://${BUCKET} --recursive || true
          # Step 2: paginated deletion of all remaining versions and delete markers
          NEXT_TOKEN=""
          while true; do
            if [ -z "$NEXT_TOKEN" ]; then
              RESPONSE=$(aws s3api list-object-versions --bucket "$BUCKET" --max-items 1000 --output json 2>/dev/null)
            else
              RESPONSE=$(aws s3api list-object-versions --bucket "$BUCKET" --max-items 1000 --starting-token "$NEXT_TOKEN" --output json 2>/dev/null)
            fi
            VERSIONS=$(echo "$RESPONSE" | python3 -c "
import sys, json
d = json.load(sys.stdin)
objs = [{'Key': v['Key'], 'VersionId': v['VersionId']} for v in d.get('Versions', [])]
objs += [{'Key': v['Key'], 'VersionId': v['VersionId']} for v in d.get('DeleteMarkers', [])]
if objs:
    print(json.dumps({'Objects': objs, 'Quiet': True}))
" 2>/dev/null)
            if [ -n "$VERSIONS" ]; then
              aws s3api delete-objects --bucket "$BUCKET" --delete "$VERSIONS" || true
            fi
            NEXT_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('NextToken',''))" 2>/dev/null)
            if [ -z "$NEXT_TOKEN" ]; then
              break
            fi
          done
      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -input=false -auto-approve
