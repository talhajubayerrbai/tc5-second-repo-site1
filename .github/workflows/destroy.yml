name: Destroy

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git revision'
        required: false
      udap_run_id:
        description: 'UDAP run id'
        required: false

concurrency:
  group: deploy-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Empty S3 bucket before destroy
        run: |
          # Delete all versioned objects
          VERSIONS=$(aws s3api list-object-versions --bucket tc5-second-repo-site1-origin --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null)
          if [ "$VERSIONS" != "null" ] && echo "$VERSIONS" | grep -q 'Key'; then
            aws s3api delete-objects --bucket tc5-second-repo-site1-origin --delete "$VERSIONS" || true
          fi
          # Delete all delete markers
          MARKERS=$(aws s3api list-object-versions --bucket tc5-second-repo-site1-origin --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null)
          if [ "$MARKERS" != "null" ] && echo "$MARKERS" | grep -q 'Key'; then
            aws s3api delete-objects --bucket tc5-second-repo-site1-origin --delete "$MARKERS" || true
          fi
          # Remove any remaining current-version objects
          aws s3 rm s3://tc5-second-repo-site1-origin --recursive || true
      - name: Terraform Destroy
        working-directory: infra
        run: terraform destroy -input=false -auto-approve
